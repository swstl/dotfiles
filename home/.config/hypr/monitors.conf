# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

#laptop
monitorv2 {
  output = eDP-1
  mode = preferred 
  position = 0x0
  scale = 1
  transform = 0
}

#desktop
monitorv2 {
  output = DP-1
  mode = 1920x1080@144
  position = 0x0
  scale = 1
  transform = 0
}
monitorv2 {
  output = DP-2
  mode = 1920x1080@144
  position = auto-right
  scale = 1
  transform = 0
}
monitorv2 {
  output = HDMI-A-1
  mode = preferred
  position = auto-up 
  scale = 1
  transform = 0
}
